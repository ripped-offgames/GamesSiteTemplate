  <!-- Structured data for Google rich results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:       #060810;
      --surface:  #0d1220;
      --border:   rgba(80, 160, 255, 0.18);
      --glow:     #3b82f6;
      --accent:   #60c8ff;
      --text:     #cde4f7;
      --muted:    #5a7a96;
      --card-h:   200px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── subtle grid background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── scanline grain ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 60px 32px 80px;
    }

    /* ── header ── */
    .header {
      text-align: center;
      margin-bottom: 56px;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    /* ── suggest button ── */
    .suggest-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .suggest-btn:hover {
      border-color: var(--accent);
      background: rgba(96,200,255,0.06);
      box-shadow: 0 0 16px rgba(96,200,255,0.15);
    }

    .suggest-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    /* ── card ── */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(96,200,255,0.07) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 0;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(96,200,255,0.5);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.5),
        0 0 0 1px rgba(96,200,255,0.12),
        0 0 40px rgba(59,130,246,0.15);
    }

    .card:hover::before { opacity: 1; }

    .card-thumb {
      width: 100%;
      height: var(--card-h);
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    .card-footer {
      position: relative;
      z-index: 1;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6,8,16,0.6);
      backdrop-filter: blur(4px);
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-icon {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      background: var(--glow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .card:hover .play-icon {
      background: var(--accent);
      transform: scale(1.1);
    }

    .play-icon svg {
      width: 10px;
      height: 10px;
      fill: #fff;
      margin-left: 2px;
    }

    /* ── badges ── */
    .badges {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .badge-new {
      background: #16a34a;
      color: #d1fae5;
      box-shadow: 0 0 10px rgba(22,163,74,0.5);
    }

    .badge-popular {
      background: #b45309;
      color: #fef3c7;
      box-shadow: 0 0 10px rgba(180,83,9,0.5);
    }

    /* ── loading pulse ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .card-thumb[src=""] {
      background: #0d1220;
      animation: pulse 1.6s infinite;
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="header">
      <h1>PIXEL VAULT</h1>
      <p>Some games may take a moment to load.</p>
      <button class="suggest-btn" onclick="openGame('https://docs.google.com/forms/d/e/1FAIpQLSfjgcg5KoxjY-QtmheZzsVoapRdigJrCCCxakkH-XzquIbReA/viewform?embedded=true')">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Suggest a Game
      </button>
    </header>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    // ── To add/remove badges, change isNew or isPopular to true/false ──
    const games = [
      { name: "Bloons TD",         img: "img/2.webp",               url: "baloonstd/baloonstd.html",                               isNew: false, isPopular: true  },
      { name: "BitLife",            img: "img/3.webp",               url: "bitlife/bitlife.html",                                   isNew: false, isPopular: true  },
      { name: "Block Blast",        img: "img/4.webp",               url: "blockblast/blockblast.html",                             isNew: false, isPopular: false },
      { name: "Cookie Clicker",     img: "img/6.webp",               url: "CookieClicker/cookieclicker.html",                       isNew: false, isPopular: true  },
      { name: "Coreball",           img: "img/7.webp",               url: "Coreball/coreball.html",                                 isNew: false, isPopular: false },
      { name: "Drive Mad",          img: "img/8.webp",               url: "DriveMad/drivemad.html",                                 isNew: false, isPopular: false },
      { name: "Paper.io 2",         img: "img/12.webp",              url: "paperio2/paper.html",                                    isNew: false, isPopular: false },
      { name: "PolyTrack",          img: "img/13.webp",              url: "polytrack.3-main/polytrack.html",                        isNew: true,  isPopular: true  },
      { name: "Plants vs Zombies",  img: "img/15.webp",              url: "pvz/pvz.html",                                           isNew: false, isPopular: true  },
      { name: "Retrobowl",          img: "img/17.webp",              url: "Retrobowl/retro.html",                                   isNew: false, isPopular: false },
      { name: "Slope",              img: "img/19.webp",              url: "slope/slope.html",                                       isNew: false, isPopular: true  },
      { name: "Subway Surfers",     img: "img/21.webp",              url: "SubwaySurfers/subwaysurfers.html",                       isNew: false, isPopular: true  },
      { name: "Time Shooter",       img: "img/23.webp",              url: "TimeShooter/timeshooter.html",                           isNew: false, isPopular: false },
      { name: "Monkey Mart",        img: "img/mm.jpg",               url: "MonkeyMart",                                             isNew: false, isPopular: false },
      { name: "Minecraft",          img: "img/minecraft.jpg",        url: "Minecraft.html",                                         isNew: false, isPopular: true  },
      { name: "Eggy Car",           img: "img/eggycar.png",          url: "EggyCar",                                                isNew: true,  isPopular: false },
      { name: "mk48.io",            img: "img/mk48.png",             url: "https://mk48.io",              external: true,           isNew: false, isPopular: false },
      { name: "Basketball Stars",   img: "img/basketball-stars.png", url: "BasketballStarsUnblocked.github.io/index.html",          isNew: false, isPopular: false },
      { name: "Tag",                img: "img/tag.png",              url: "https://www.coolmathgames.com/0-tag-game/play", external: true,  isNew: true,  isPopular: false },
      { name: "FNAF",               img: "img/fnaf.png",             url: "https://ripped-offgames.github.io/fnaf/index.html", external: true, isNew: false, isPopular: true  },
      { name: "Buckshot Roulette",  img: "img/backshot.png",         url: "https://ripped-offgames.github.io/buckshot/index.html", external: true, isNew: true, isPopular: true },
    ];

    function openGame(url) {
      window.open(url, "_blank");
    }

    const grid = document.getElementById("grid");

    games.forEach(({ name, img, url, isNew, isPopular }) => {
      const badgesHTML = (isNew || isPopular) ? `
        <div class="badges">
          ${isPopular ? '<span class="badge badge-popular">🔥 Popular</span>' : ''}
          ${isNew     ? '<span class="badge badge-new">✨ New</span>' : ''}
        </div>` : '';

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openGame(url);
      card.innerHTML = `
        ${badgesHTML}
        <img class="card-thumb" src="${img}" alt="${name} unblocked free online game" loading="lazy" />
        <div class="card-footer">
          <span class="card-name">${name}</span>
          <div class="play-icon">
            <svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  </script>
</body>
